# Fish et al. (2024) replication: single LLM agent per firm, duopoly, no communication.
name: fish_replication
seed: 0
rounds: 300            # Fish et al. ran 300 periods
output_dir: runs

market:
  n_firms: 2
  alpha: 1.0           # price scale; Fish et al. also use 3.2 and 10
  beta: 100.0
  a: 2.0
  a0: 0.0
  mu: 0.25
  cost: 1.0
  max_wtp: null        # set e.g. 4.51 to add "no customer would pay more than $X"

team:
  size: 1
  structure: single    # single | average | vote | leader | representatives
  leader: first        # leader structure: first | random
  n_representatives: 1 # representatives structure
  reelect_every: 0     # 0 = elect once
  ballot_shows_rationales: true

communication:
  channels: []         # any of: team_dm, team_open, cross_dm, all_dm, global_open
  subrounds: 1
  max_chars: 800
  history_rounds: 3

agent:
  model: deepseek/deepseek-v4-flash
  reasoning: true
  reasoning_effort: null
  temperature: 1.0
  max_tokens: 8000
  prompt_prefix: P1    # P1 | P2
  memory: conversation # conversation (one chat per agent) | notes (Fish et al.: stateless calls + PLANS/INSIGHTS)
  context_chars: 400000
  history_window: 100
  show_competitor_prices: true
  max_price: 10.0

judge:
  model: deepseek/deepseek-v4-flash
  reasoning: true
  temperature: 0.0
  max_tokens: 8000

llm:
  provider: vllm       # vllm (our Modal server, MODAL_LLM_URL/MODAL_LLM_KEY in .env) | openrouter | mock
  api_key_env: OPENROUTER_KEY  # openrouter only
  concurrency: 16
  timeout: 90          # vllm uses at least 900 s (cold starts)
  provider_routing:    # openrouter only; null = let OpenRouter pick hosts per call (slower, mixed)
    only: [baidu, gmicloud]
    allow_fallbacks: false
  max_retries: 5
